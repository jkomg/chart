name: Deploy chart

# PRs: build the image to prove it builds. Merges to main: build, push, and roll out to Cloud Run.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLOUDSDK_CORE_PROJECT: chart-jkomg
  REGION: us-east1
  SERVICE: chart
  IMAGE: us-east1-docker.pkg.dev/chart-jkomg/chart/chart

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: chart:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Catches a module missing from the image (the server starts, but every request fails).
      - name: App loads inside the image
        run: |
          docker run --rm -e TURSO_DATABASE_URL=file:/tmp/ci.db --entrypoint python chart:pr -c "
          import app
          c = app.app.test_client()
          assert c.get('/login').status_code == 200
          assert c.get('/api/vitals').status_code == 401
          print('ok')"

      - name: Dashboard and account isolation regressions
        run: docker run --rm -v "$PWD/tests:/tests:ro" --entrypoint python chart:pr -m unittest discover -s /tests -v

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://chart.jkomg.us
    permissions:
      contents: read
      id-token: write  # keyless auth to GCP via Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/572822335911/locations/global/workloadIdentityPools/github/providers/chart-repo
          service_account: github-deployer@chart-jkomg.iam.gserviceaccount.com
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: us-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64  # libsql has no linux/arm64 wheel
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: google-github-actions/setup-gcloud@v2
      # Roll out with no traffic, smoke-test that revision on its own URL, then switch traffic.
      # Only the image changes; env vars and Secret Manager refs on the service are kept.
      - name: Deploy candidate (no traffic)
        run: |
          gcloud run deploy "$SERVICE" --region "$REGION" --image "$IMAGE:${{ github.sha }}" --no-traffic --tag candidate --quiet
      - name: Smoke test candidate
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
            | python3 -c "import json,sys; print(next(t['url'] for t in json.load(sys.stdin)['status']['traffic'] if t.get('tag') == 'candidate'))")
          curl -fsS --retry 5 --retry-all-errors -o /dev/null -w "GET /login -> %{http_code}\n" "$url/login"
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$url/api/vitals")
          echo "GET /api/vitals -> $code"; test "$code" = 401
      - name: Send traffic to the new revision
        run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest --quiet
