<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password — Chart</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">✦</div>
    <p class="eyebrow">FIRST SIGN IN</p>
    <h1>Choose a new password</h1>
    <p class="login-copy">Set a private password for your {{ account_kind|default('provider') }} account before continuing.</p>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" class="login-form" autocomplete="on">
      <label>Temporary password<input name="current_password" type="password" autocomplete="current-password" required autofocus></label>
      <label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="12" required></label>
      <label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></label>
      <button type="submit" class="primary-button">Save new password</button>
    </form>
  </main>
</body>
</html>
