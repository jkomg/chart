# Copy this to secret.yaml, fill the values, encrypt it with SOPS, and commit the encrypted file.
# Generate a password hash with: python3 -c 'from app import hash_password; print(hash_password(input()))'
apiVersion: v1
kind: Secret
metadata:
  name: chart
  namespace: chart
type: Opaque
stringData:
  CHART_SESSION_SECRET: replace-with-a-long-random-secret
  CHART_USERS: '{"jason": "pbkdf2_sha256$310000$replace$replace", "mia": "pbkdf2_sha256$310000$replace$replace"}'
  CHART_COOKIE_SECURE: "true"
