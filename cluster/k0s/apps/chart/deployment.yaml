apiVersion: apps/v1
kind: Deployment
metadata:
  name: chart
  namespace: chart
  labels:
    app: chart
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: chart }
  template:
    metadata:
      labels: { app: chart }
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: chart
          image: ghcr.io/jkomg/chart:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: chart
          env:
            - name: PORT
              value: "8080"
            - name: CHART_DATA_DIR
              value: /data
          volumeMounts:
            - name: chart-data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 25
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: chart-data
          persistentVolumeClaim:
            claimName: chart-data
