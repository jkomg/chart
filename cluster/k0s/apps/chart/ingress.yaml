apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chart
  namespace: chart
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: chart.lan.jkomg.us
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chart
                port: { name: http }
